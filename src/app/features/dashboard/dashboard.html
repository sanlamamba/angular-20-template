<div class="container mx-auto p-6 max-w-7xl">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Dashboard</h1>
    <p class="text-gray-600 dark:text-gray-400">Welcome back, {{ auth.currentUser()?.name }}!</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <p-card>
      <ng-template pTemplate="header">
        <div
          class="p-6 bg-gradient-to-br from-primary-50 to-primary-100 dark:from-primary-900 dark:to-primary-800"
        >
          <i class="pi pi-user text-4xl text-primary-600 dark:text-primary-300"></i>
        </div>
      </ng-template>
      <h3 class="text-xl font-semibold mb-2 text-gray-900 dark:text-white">Welcome!</h3>
      <p class="text-gray-600 dark:text-gray-300">
        Hello, {{ auth.currentUser()?.name }}. You are logged in as a
        <span class="font-semibold text-primary-600 dark:text-primary-400">{{
          auth.currentUser()?.role
        }}</span
        >.
      </p>
    </p-card>

    <p-card>
      <ng-template pTemplate="header">
        <div
          class="p-6 bg-gradient-to-br from-green-50 to-green-100 dark:from-green-900 dark:to-green-800"
        >
          <i class="pi pi-check-circle text-4xl text-green-600 dark:text-green-300"></i>
        </div>
      </ng-template>
      <h3 class="text-xl font-semibold mb-2 text-gray-900 dark:text-white">Status</h3>
      <p class="text-gray-600 dark:text-gray-300">
        All systems operational. Your session is active.
      </p>
    </p-card>

    <p-card>
      <ng-template pTemplate="header">
        <div
          class="p-6 bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-900 dark:to-blue-800"
        >
          <i class="pi pi-info-circle text-4xl text-blue-600 dark:text-blue-300"></i>
        </div>
      </ng-template>
      <h3 class="text-xl font-semibold mb-2 text-gray-900 dark:text-white">Quick Info</h3>
      <p class="text-gray-600 dark:text-gray-300">
        This is a demo dashboard showing protected content.
      </p>
    </p-card>
  </div>
</div>
