<div class="container mx-auto p-6 max-w-7xl">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Admin Panel</h1>
    <p class="text-gray-600 dark:text-gray-400">
      Welcome, {{ auth.currentUser()?.name }}. This area is restricted to administrators only.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    @for (stat of stats; track stat.label) {
      <p-card>
        <div class="flex items-center gap-4">
          <div
            [class]="
              'p-4 rounded-xl shadow-sm transition-all duration-200 ' +
              getStatColorClasses(stat.color)
            "
          >
            <i class="pi {{ stat.icon }} text-2xl"></i>
          </div>

          <div class="flex-1">
            <p class="text-sm font-medium text-gray-600 dark:text-gray-400">{{ stat.label }}</p>
            <p class="text-2xl font-bold text-gray-900 dark:text-white mt-1">{{ stat.value }}</p>
          </div>
        </div>
      </p-card>
    }
  </div>

  <p-card>
    <ng-template pTemplate="header">
      <div class="px-6 pt-6">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">User Management</h2>
      </div>
    </ng-template>

    <p-table [value]="users" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span [class]="user.role | roleBadge">
              {{ user.role }}
            </span>
          </td>
          <td>
            <span
              class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200"
            >
              {{ user.status }}
            </span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
